# Checks the dashboard on pushes to main and on every pull request.
# No npm install: the tools use only Node built-ins plus the libraries embedded in index.html.
name: Dashboard checks

on:
  push:
    branches: [main]          # feature branches are checked through their pull request
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata          # the analysts' timezone: Excel-date handling is timezone-sensitive
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Structural and compliance invariants
        run: node tools/check-invariants.js
      - name: End-to-end smoke test on the synthetic book
        run: node tools/smoke-review.js
      - name: AI Analyst acceptance test
        run: node tools/test-ai-analyst.js
      - name: Known-answer regression tests of fixed issues
        run: node tools/run-regression.js

  # The new build (CR-0006), milestone M1.1: zero-dependency safety checks, Node built-ins only.
  # See docs/new-build/safety-tooling.md. M1.2 extends this job (npm ci, typecheck, build, invariants).
  next:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Privacy scan of docs/ and the root Markdown (generic rules; the private deny-list is local only)
        run: node scripts/validation/privacy-scan.mjs docs *.md
      - name: Documentation links
        run: node scripts/validation/docs-links.mjs
      # M1.3: the new app's TypeScript tests run straight from source (Node 24 type stripping, no build).
      - name: Tests (IST)
        run: node --test "tests/**/*.test.mjs" "tests/**/*.test.ts"
        env:
          TZ: Asia/Kolkata
      - name: Tests (UTC)
        run: node --test "tests/**/*.test.mjs" "tests/**/*.test.ts"
        env:
          TZ: UTC
      - name: Traceability (every test names what it covers; rows in progress have a test)
        run: node scripts/validation/traceability.mjs
