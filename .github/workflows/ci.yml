# Checks the dashboard on pushes to main and on every pull request.
# Job "checks" (the legacy index.html) needs no npm install: its tools use only Node built-ins plus the libraries
# embedded in index.html. Job "next" (the new app, CR-0006) installs its pinned build tooling with npm ci (D-025).
name: Dashboard checks

on:
  push:
    branches: [main]          # feature branches are checked through their pull request
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata          # the analysts' timezone: Excel-date handling is timezone-sensitive
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Structural and compliance invariants
        run: node tools/check-invariants.js
      - name: End-to-end smoke test on the synthetic book
        run: node tools/smoke-review.js
      - name: AI Analyst acceptance test
        run: node tools/test-ai-analyst.js
      - name: Known-answer regression tests of fixed issues
        run: node tools/run-regression.js

  # The new build (CR-0006). M1.1: zero-dependency safety checks (docs/new-build/safety-tooling.md).
  # M1.2: the pinned toolchain from the lockfile, type check, the one-file build and its invariants
  # (docs/new-build/toolchain.md). No npm cache: npm ci fetches exactly the lockfile's tarballs on every run.
  next:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Privacy scan of docs/ and the root Markdown (generic rules; the private deny-list is local only)
        run: node scripts/validation/privacy-scan.mjs docs *.md
      - name: Documentation links
        run: node scripts/validation/docs-links.mjs
      - name: Install the pinned build tooling from the lockfile (install scripts disabled by .npmrc)
        run: npm ci
      - name: Type check (TypeScript, no emit)
        run: npm run typecheck
      - name: Build the new app into one offline HTML file
        run: npm run build
      - name: Invariants of the built page (CSP, no network, one allowed link, banner) and a byte-identical rebuild
        run: node scripts/validation/check-next.mjs --rebuild
      - name: Tests (IST)
        run: node --test "tests/**/*.test.mjs"
        env:
          TZ: Asia/Kolkata
      - name: Tests (UTC)
        run: node --test "tests/**/*.test.mjs"
        env:
          TZ: UTC
