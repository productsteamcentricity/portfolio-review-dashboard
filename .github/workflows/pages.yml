# Publishes ONLY index.html to GitHub Pages: the site serves the dashboard, never the
# docs, tools or agent files as web pages. The site is public (see docs/DEPLOYMENT.md).
# Requires: Settings -> Pages -> Source = "GitHub Actions".
# The build job runs the repository's code with read-only rights; only the deploy
# job, which runs no repository code, can write to Pages.
name: Publish dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Invariants must hold before anything is published
        run: node tools/check-invariants.js
      - name: Smoke test must pass before anything is published
        run: node tools/smoke-review.js
      - name: Stage only the dashboard
        run: |
          mkdir _site
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deploy
        uses: actions/deploy-pages@v5
